# swagger/components/schemas/contact.yaml

type: object
required:
  - name
  - phoneNumber
  - contactType
  - userId
properties:
  name:
    description: 'Contact name'
    type: string
    example: 'John Doe'
  phoneNumber:
    description: 'Contact phone number'
    type: string
    example: +380000000004
  contactType:
    description: 'Contact type'
    type: string
    enum: ['work', 'home', 'personal']
  userId:
    description: 'User id'
    type: string
    example: 65e4decdd286b30065d54af9
